<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agile Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📋</text></svg>"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-text">
        <h1>Agile Tracker</h1>
        <p class="tagline">Kasutajalugude Kanban-laud</p>
      </div>
      <div class="toolbar">
        <button type="button" class="btn primary" id="new-story-btn">+ Lisa story</button>
      </div>
    </header>

    <main class="board" id="board">
      <section class="column" data-status="todo">
        <header class="column-header">
          <h2>Todo / Backlog</h2>
          <span class="column-meta">
            <span data-count>0</span> story · <span data-points>0</span> p
          </span>
        </header>
        <div class="cards" data-list="todo"></div>
      </section>

      <section class="column" data-status="doing">
        <header class="column-header">
          <h2>Doing</h2>
          <span class="column-meta">
            <span data-count>0</span> story · <span data-points>0</span> p
          </span>
        </header>
        <div class="cards" data-list="doing"></div>
      </section>

      <section class="column" data-status="done">
        <header class="column-header">
          <h2>Done</h2>
          <span class="column-meta">
            <span data-count>0</span> story · <span data-points>0</span> p
          </span>
        </header>
        <div class="cards" data-list="done"></div>
      </section>
    </main>

    <!-- Create / edit story dialog -->
    <dialog id="story-dialog" class="dialog">
      <form id="story-form" class="story-form">
        <h2 id="story-form-title">Uus story</h2>

        <label class="field">
          <span>Pealkiri *</span>
          <input type="text" name="title" autocomplete="off" />
        </label>

        <label class="field">
          <span>Kirjeldus</span>
          <textarea name="description" rows="3"></textarea>
        </label>

        <div class="field-row">
          <label class="field">
            <span>Punktid *</span>
            <input type="number" name="points" min="0" step="1" inputmode="numeric" />
          </label>
          <label class="field">
            <span>Staatus</span>
            <select name="status">
              <option value="todo">todo</option>
              <option value="doing">doing</option>
              <option value="done">done</option>
            </select>
          </label>
        </div>

        <fieldset class="criteria">
          <legend>Vastuvõtutingimused *</legend>
          <div id="criteria-list"></div>
          <button type="button" class="btn small" id="add-criterion">+ Lisa tingimus</button>
        </fieldset>

        <ul class="form-errors" id="form-errors" hidden></ul>

        <menu class="dialog-actions">
          <button type="button" class="btn" data-close>Tühista</button>
          <button type="submit" class="btn primary">Salvesta</button>
        </menu>
      </form>
    </dialog>

    <!-- Story detail view (description, acceptance criteria, comments) -->
    <dialog id="detail-dialog" class="dialog">
      <div id="detail-content" class="detail"></div>
    </dialog>

    <script src="/js/vendor/Sortable.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
